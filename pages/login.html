<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyShield AI | Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="login" data-root="../">
  <div class="container-fluid">
    <div class="row auth-wrapper">
      <div class="col-lg-6 auth-image login d-flex align-items-end p-5">
        <div class="text-white"><h2 class="fw-bold">Welcome back!</h2><p class="mb-0">Check today's weather risk and get ready for school.</p></div>
      </div>
      <div class="col-lg-6 d-flex align-items-center justify-content-center py-5">
        <div class="w-100 px-3" style="max-width: 400px;">
          <a href="../index.html" class="navbar-brand fw-bold fs-4 text-decoration-none text-dark d-block mb-4"><i class="bi bi-shield-fill-check text-brand"></i> SkyShield AI</a>
          <h3 class="fw-bold">Login</h3>
          <p class="text-muted">Enter your account details below.</p>
          <div id="msg"></div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="lEmail" class="form-label">Email address</label>
              <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" id="lEmail" placeholder="name@example.com" autocomplete="username"></div>
            </div>
            <div class="mb-3">
              <label for="lPass" class="form-label">Password</label>
              <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input type="password" class="form-control" id="lPass" placeholder="Password" autocomplete="current-password"><button class="btn btn-outline-secondary" type="button" data-toggle-pass="lPass" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
            </div>
            <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="remember" checked><label class="form-check-label" for="remember">Remember me on this device</label></div>
            <button type="submit" class="btn btn-brand w-100 py-2">Login</button>
          </form>
          <p class="text-center mt-4 mb-0">No account yet? <a href="signup.html">Sign up</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
