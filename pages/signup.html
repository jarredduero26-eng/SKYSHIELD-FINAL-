<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyShield AI | Sign Up</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="signup" data-root="../">
  <div class="container-fluid">
    <div class="row auth-wrapper">
      <div class="col-lg-6 order-lg-2 auth-image signup d-flex align-items-end p-5">
        <div class="text-white"><h2 class="fw-bold">Join SkyShield AI</h2><p class="mb-0">Free, private and works without internet.</p></div>
      </div>
      <div class="col-lg-6 order-lg-1 d-flex align-items-center justify-content-center py-5">
        <div class="w-100 px-3" style="max-width: 450px;">
          <a href="../index.html" class="navbar-brand fw-bold fs-4 text-decoration-none text-dark d-block mb-4"><i class="bi bi-shield-fill-check text-brand"></i> SkyShield AI</a>
          <h3 class="fw-bold">Create your account</h3>
          <p class="text-muted">Saved on this device, so it works offline.</p>
          <div id="msg"></div>
          <form id="signForm" novalidate>
            <div class="mb-3"><label for="sName" class="form-label">Full name</label><input type="text" class="form-control" id="sName" placeholder="Juan Dela Cruz"></div>
            <div class="mb-3"><label for="sEmail" class="form-label">Email address</label><input type="email" class="form-control" id="sEmail" placeholder="name@example.com" autocomplete="username"></div>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label for="sPass" class="form-label">Password</label><div class="input-group"><input type="password" class="form-control" id="sPass" placeholder="6+ characters" autocomplete="new-password"><button class="btn btn-outline-secondary" type="button" data-toggle-pass="sPass" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
              <div class="col-md-6"><label for="sPass2" class="form-label">Confirm password</label><div class="input-group"><input type="password" class="form-control" id="sPass2" placeholder="Repeat password" autocomplete="new-password"><button class="btn btn-outline-secondary" type="button" data-toggle-pass="sPass2" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
            </div>
            <button type="submit" class="btn btn-brand w-100 py-2">Sign Up</button>
          </form>
          <p class="text-center mt-4 mb-0">Already registered? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
